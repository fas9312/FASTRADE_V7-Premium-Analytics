name: Cleanup old artifacts

on:
  push:
    branches: [ main ]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[artifact-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - name: Keep only latest artifact for each build name
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,{ owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            artifacts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
            const keptNames = new Set();
            for (const artifact of artifacts) {
              if (!keptNames.has(artifact.name)) { keptNames.add(artifact.name); core.info(`KEEP ${artifact.id} ${artifact.name}`); continue; }
              await github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifact.id });
              core.info(`DELETE ${artifact.id} ${artifact.name}`);
            }
